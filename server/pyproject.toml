[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "clash-license-api"
version = "1.0.0"
requires-python = ">=3.12"
description = "License key validation API for Clash Auto Loot"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "stripe>=10.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
]
